<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ginger — OpenTelemetry Tracing Toolkit for Kubernetes with a Controlled Supply-Chain</title>
  <meta name="description" content="Ginger is a production-grade OpenTelemetry tracing toolkit for Kubernetes with post-quantum cryptography, multi-protocol ingestion, and InfluxDB storage.">
  <meta property="og:site_name" content="Ginger">
  <meta property="og:title" content="Ginger — OpenTelemetry Tracing Toolkit for Kubernetes with a Controlled Supply-Chain">
  <meta property="og:description" content="Production-grade distributed tracing with post-quantum cryptography, multi-protocol ingestion (OTLP, Jaeger, Zipkin), and InfluxDB storage.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ginger.asymmetric-effort.com">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="logo.png">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"Ginger","url":"https://ginger.asymmetric-effort.com","applicationCategory":"DeveloperApplication","operatingSystem":"Linux, macOS, Windows","description":"A production-grade OpenTelemetry tracing toolkit for Kubernetes with post-quantum cryptography, multi-protocol ingestion, and InfluxDB storage.","license":"https://opensource.org/licenses/MIT","author":{"@type":"Organization","name":"Asymmetric Effort, LLC","url":"https://asymmetric-effort.com"},"offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
  <script type="module">
    import { createElement, useState, useEffect } from 'https://cdn.jsdelivr.net/npm/@asymmetric-effort/specifyjs@0.3.8/dist/specifyjs.esm.js';
    import { createRoot } from 'https://cdn.jsdelivr.net/npm/@asymmetric-effort/specifyjs@0.3.8/dist/specifyjs-dom.esm.js';

    const h = createElement;

    function useTheme() {
      const [dark, setDark] = useState(
        typeof window !== 'undefined' && window.matchMedia('(prefers-color-scheme: dark)').matches
      );
      useEffect(() => {
        const mq = window.matchMedia('(prefers-color-scheme: dark)');
        const handler = (e) => setDark(e.matches);
        mq.addEventListener('change', handler);
        return () => mq.removeEventListener('change', handler);
      }, []);
      return [dark, setDark];
    }

    const theme = {
      light: {
        primary: '#3b82f6',
        primaryHover: '#2563eb',
        bg: '#ffffff',
        bgAlt: '#f8fafc',
        bgCard: '#ffffff',
        text: '#0f172a',
        textSecondary: '#475569',
        border: '#e2e8f0',
        codeBg: '#1e293b',
        codeText: '#e2e8f0',
      },
      dark: {
        primary: '#60a5fa',
        primaryHover: '#93c5fd',
        bg: '#0f172a',
        bgAlt: '#1e293b',
        bgCard: '#1e293b',
        text: '#f1f5f9',
        textSecondary: '#94a3b8',
        border: '#334155',
        codeBg: '#020617',
        codeText: '#e2e8f0',
      },
    };

    function Header({ dark, setDark, t }) {
      return h('header', {
        style: {
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'space-between',
          padding: '16px 24px',
          borderBottom: `1px solid ${t.border}`,
          position: 'sticky',
          top: '0',
          background: t.bg,
          zIndex: '100',
        },
      },
        h('div', { style: { display: 'flex', alignItems: 'center', gap: '12px' } },
          h('img', { src: 'logo.png', alt: 'Ginger logo', style: { width: '36px', height: '36px', borderRadius: '6px' } }),
          h('span', { style: { fontSize: '20px', fontWeight: '700', color: t.text } }, 'Ginger'),
        ),
        h('nav', { style: { display: 'flex', alignItems: 'center', gap: '20px' } },
          h('a', { href: '#features', style: { color: t.textSecondary, textDecoration: 'none', fontSize: '14px', fontWeight: '500' } }, 'Features'),
          h('a', { href: '#install', style: { color: t.textSecondary, textDecoration: 'none', fontSize: '14px', fontWeight: '500' } }, 'Install'),
          h('a', { href: '#architecture', style: { color: t.textSecondary, textDecoration: 'none', fontSize: '14px', fontWeight: '500' } }, 'Architecture'),
          h('a', { href: '#links', style: { color: t.textSecondary, textDecoration: 'none', fontSize: '14px', fontWeight: '500' } }, 'Links'),
          h('button', {
            onClick: () => setDark(!dark),
            style: {
              background: t.bgAlt,
              border: `1px solid ${t.border}`,
              borderRadius: '6px',
              padding: '6px 12px',
              cursor: 'pointer',
              color: t.text,
              fontSize: '14px',
            },
          }, dark ? 'Light' : 'Dark'),
        ),
      );
    }

    function Hero({ t }) {
      return h('section', {
        style: {
          textAlign: 'center',
          padding: '80px 24px 60px',
          maxWidth: '800px',
          margin: '0 auto',
        },
      },
        h('img', { src: 'logo.png', alt: 'Ginger logo', style: { width: '96px', height: '96px', borderRadius: '16px', marginBottom: '24px' } }),
        h('h1', { style: { fontSize: '48px', fontWeight: '800', color: t.text, margin: '0 0 16px', lineHeight: '1.1' } }, 'Ginger'),
        h('p', { style: { fontSize: '22px', color: t.textSecondary, margin: '0 0 32px', lineHeight: '1.5' } },
          'OpenTelemetry Tracing Toolkit for Kubernetes with a Controlled Supply-Chain',
        ),
        h('div', { style: { display: 'flex', gap: '12px', justifyContent: 'center', flexWrap: 'wrap' } },
          h('a', {
            href: 'https://github.com/asymmetric-effort/ginger',
            style: {
              display: 'inline-block',
              padding: '12px 28px',
              background: t.primary,
              color: '#ffffff',
              borderRadius: '8px',
              textDecoration: 'none',
              fontWeight: '600',
              fontSize: '16px',
            },
          }, 'View on GitHub'),
          h('a', {
            href: '#install',
            style: {
              display: 'inline-block',
              padding: '12px 28px',
              background: 'transparent',
              color: t.primary,
              border: `2px solid ${t.primary}`,
              borderRadius: '8px',
              textDecoration: 'none',
              fontWeight: '600',
              fontSize: '16px',
            },
          }, 'Get Started'),
        ),
      );
    }

    function FeatureCard({ title, description, t }) {
      return h('div', {
        style: {
          background: t.bgCard,
          border: `1px solid ${t.border}`,
          borderRadius: '12px',
          padding: '24px',
          flex: '1 1 300px',
          minWidth: '280px',
        },
      },
        h('h3', { style: { fontSize: '18px', fontWeight: '700', color: t.text, margin: '0 0 8px' } }, title),
        h('p', { style: { fontSize: '14px', color: t.textSecondary, margin: '0', lineHeight: '1.6' } }, description),
      );
    }

    function Features({ t }) {
      const features = [
        {
          title: 'Post-Quantum Cryptography',
          description: 'Hybrid X25519 + ML-KEM-768 key exchange for forward-secure TLS. Protects trace data against both classical and quantum adversaries.',
        },
        {
          title: 'Multi-Protocol Ingestion',
          description: 'Native support for OTLP (gRPC and HTTP), Jaeger (Thrift and gRPC), and Zipkin protocols. Drop-in replacement for existing collectors.',
        },
        {
          title: 'InfluxDB Storage Backend',
          description: 'Purpose-built storage layer using InfluxDB for time-series trace data with configurable retention, downsampling, and high-throughput writes.',
        },
        {
          title: 'Adaptive and Tail Sampling',
          description: 'Intelligent sampling strategies that capture error traces, high-latency requests, and statistically representative samples while reducing storage costs.',
        },
        {
          title: 'Multi-Tenancy',
          description: 'Tenant-aware ingestion, storage isolation, and query-time filtering. Role-based access control with per-tenant rate limiting and quotas.',
        },
        {
          title: 'Client SDKs',
          description: 'First-party SDKs for Go, Python, and TypeScript. Auto-instrumentation, context propagation, and PQC-secured export out of the box.',
        },
      ];

      return h('section', {
        id: 'features',
        style: { padding: '60px 24px', maxWidth: '1100px', margin: '0 auto' },
      },
        h('h2', { style: { fontSize: '32px', fontWeight: '700', color: t.text, textAlign: 'center', margin: '0 0 40px' } }, 'Features'),
        h('div', {
          style: {
            display: 'flex',
            flexWrap: 'wrap',
            gap: '20px',
          },
        },
          ...features.map((f) => h(FeatureCard, { key: f.title, title: f.title, description: f.description, t })),
        ),
      );
    }

    function CodeBlock({ code, t }) {
      return h('pre', {
        style: {
          background: t.codeBg,
          color: t.codeText,
          padding: '16px 20px',
          borderRadius: '8px',
          overflowX: 'auto',
          fontSize: '13px',
          lineHeight: '1.6',
          margin: '0',
        },
      }, h('code', null, code));
    }

    function Install({ t }) {
      return h('section', {
        id: 'install',
        style: { padding: '60px 24px', maxWidth: '800px', margin: '0 auto' },
      },
        h('h2', { style: { fontSize: '32px', fontWeight: '700', color: t.text, textAlign: 'center', margin: '0 0 40px' } }, 'Installation'),

        h('h3', { style: { fontSize: '18px', fontWeight: '600', color: t.text, margin: '0 0 12px' } }, 'Docker'),
        h(CodeBlock, { t, code: 'docker pull ghcr.io/asymmetric-effort/ginger:latest\ndocker run -p 4317:4317 -p 4318:4318 -p 16686:16686 \\\n  ghcr.io/asymmetric-effort/ginger:latest' }),

        h('h3', { style: { fontSize: '18px', fontWeight: '600', color: t.text, margin: '32px 0 12px' } }, 'Helm'),
        h(CodeBlock, { t, code: 'helm install ginger oci://ghcr.io/asymmetric-effort/charts/ginger' }),

        h('h3', { style: { fontSize: '18px', fontWeight: '600', color: t.text, margin: '32px 0 12px' } }, 'Go SDK'),
        h(CodeBlock, { t, code: 'go get github.com/asymmetric-effort/ginger/sdk/go' }),

        h('h3', { style: { fontSize: '18px', fontWeight: '600', color: t.text, margin: '32px 0 12px' } }, 'Python SDK'),
        h(CodeBlock, { t, code: 'pip install asymmetric-effort-ginger' }),

        h('h3', { style: { fontSize: '18px', fontWeight: '600', color: t.text, margin: '32px 0 12px' } }, 'TypeScript SDK'),
        h(CodeBlock, { t, code: 'npm install @asymmetric-effort/ginger' }),
      );
    }

    function Architecture({ t }) {
      const diagram = [
        '+-------------------------------------------------------+',
        '|                    Client SDKs                         |',
        '|            Go  /  Python  /  TypeScript                |',
        '+-------+----------+-----------+-----------+-------------+',
        '        |          |           |           |              ',
        '     OTLP/gRPC  OTLP/HTTP  Jaeger      Zipkin           ',
        '        |          |           |           |              ',
        '+-------v----------v-----------v-----------v-------------+',
        '|                   Ginger Collector                     |',
        '|  +-------------+  +-------------+  +--------------+   |',
        '|  |  Receiver   |  |  Processor  |  |   Exporter   |   |',
        '|  |  (multi-    |->|  (sampling, |->|   (storage,  |   |',
        '|  |   protocol) |  |   PQC TLS)  |  |    query)    |   |',
        '|  +-------------+  +-------------+  +--------------+   |',
        '+------------------------+------------------------------+',
        '                         |                                ',
        '           +-------------v--------------+                 ',
        '           |       InfluxDB             |                 ',
        '           |   (trace storage,          |                 ',
        '           |    retention, downsampling)|                 ',
        '           +----------------------------+                 ',
        '                         |                                ',
        '           +-------------v--------------+                 ',
        '           |     Query API (v3)         |                 ',
        '           |   Jaeger-compatible UI     |                 ',
        '           +----------------------------+                 ',
      ].join('\n');

      return h('section', {
        id: 'architecture',
        style: { padding: '60px 24px', maxWidth: '800px', margin: '0 auto' },
      },
        h('h2', { style: { fontSize: '32px', fontWeight: '700', color: t.text, textAlign: 'center', margin: '0 0 40px' } }, 'Architecture'),
        h('p', { style: { fontSize: '15px', color: t.textSecondary, textAlign: 'center', margin: '0 0 24px', lineHeight: '1.6' } },
          'Ginger implements the OpenTelemetry Collector pipeline architecture with receivers, processors, and exporters. Traces flow from client SDKs through multi-protocol receivers, are processed with adaptive sampling and PQC-secured TLS, and stored in InfluxDB for querying via a Jaeger-compatible API.',
        ),
        h(CodeBlock, { t, code: diagram }),
      );
    }

    function LinkCard({ title, url, description, t }) {
      return h('a', {
        href: url,
        style: {
          display: 'block',
          background: t.bgCard,
          border: `1px solid ${t.border}`,
          borderRadius: '12px',
          padding: '20px 24px',
          textDecoration: 'none',
          flex: '1 1 220px',
          minWidth: '200px',
          transition: 'border-color 0.15s',
        },
      },
        h('h3', { style: { fontSize: '16px', fontWeight: '700', color: t.primary, margin: '0 0 6px' } }, title),
        h('p', { style: { fontSize: '13px', color: t.textSecondary, margin: '0' } }, description),
      );
    }

    function Links({ t }) {
      const links = [
        { title: 'GitHub', url: 'https://github.com/asymmetric-effort/ginger', description: 'Source code, issues, and contributions' },
        { title: 'Documentation', url: 'https://github.com/asymmetric-effort/ginger/tree/main/docs', description: 'Guides, API reference, and architecture docs' },
        { title: 'npm', url: 'https://www.npmjs.com/package/@asymmetric-effort/ginger', description: 'TypeScript SDK package' },
        { title: 'PyPI', url: 'https://pypi.org/project/asymmetric-effort-ginger/', description: 'Python SDK package' },
        { title: 'GHCR', url: 'https://ghcr.io/asymmetric-effort/ginger', description: 'Docker container images' },
        { title: 'Helm Charts', url: 'https://ghcr.io/asymmetric-effort/charts/ginger', description: 'Kubernetes Helm charts' },
      ];

      return h('section', {
        id: 'links',
        style: { padding: '60px 24px', maxWidth: '1100px', margin: '0 auto' },
      },
        h('h2', { style: { fontSize: '32px', fontWeight: '700', color: t.text, textAlign: 'center', margin: '0 0 40px' } }, 'Resources'),
        h('div', {
          style: { display: 'flex', flexWrap: 'wrap', gap: '16px' },
        },
          ...links.map((l) => h(LinkCard, { key: l.title, title: l.title, url: l.url, description: l.description, t })),
        ),
      );
    }

    function Footer({ t }) {
      return h('footer', {
        style: {
          textAlign: 'center',
          padding: '32px 24px',
          borderTop: `1px solid ${t.border}`,
          marginTop: '40px',
          color: t.textSecondary,
          fontSize: '13px',
        },
      },
        h('p', { style: { margin: '0' } }, '(c) 2025-2026 Asymmetric Effort, LLC. MIT License.'),
        h('p', { style: { margin: '8px 0 0', fontSize: '12px' } },
          'Built with ',
          h('a', { href: 'https://specifyjs.asymmetric-effort.com', style: { color: t.primary, textDecoration: 'none' } }, 'SpecifyJS'),
        ),
      );
    }

    function App() {
      const [dark, setDark] = useTheme();
      const t = dark ? theme.dark : theme.light;

      return h('div', {
        style: {
          background: t.bg,
          color: t.text,
          minHeight: '100vh',
          fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif',
          lineHeight: '1.6',
          transition: 'background-color 0.2s, color 0.2s',
        },
      },
        h(Header, { dark, setDark, t }),
        h(Hero, { t }),
        h(Features, { t }),
        h(Install, { t }),
        h(Architecture, { t }),
        h(Links, { t }),
        h(Footer, { t }),
      );
    }

    createRoot(document.getElementById('root')).render(h(App, null));
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>

      <section class="ns-section">
        <h2 class="ns-section-title">Links</h2>
        <div class="ns-section-content">
