name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go]
    steps:
      - name: Checkout
        uses: asymmetric-effort/actions/actions/checkout@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1

      - name: Setup Go
        uses: asymmetric-effort/actions/actions/setup-go@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: asymmetric-effort/actions/actions/codeql-init@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: asymmetric-effort/actions/actions/codeql-autobuild@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1

      - name: Perform CodeQL Analysis
        uses: asymmetric-effort/actions/actions/codeql-analyze@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
        with:
          category: "/language:${{ matrix.language }}"
