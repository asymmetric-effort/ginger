name: Full CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  pages: write

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: Lint ───────────────────────────────────────────────────
  lint:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
      - uses: asymmetric-effort/actions/actions/setup-go@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
        with:
          go-version-file: go.mod
      - uses: asymmetric-effort/actions/actions/go-tooling@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: go vet ./...
      - run: golangci-lint run --timeout 5m
      - name: Check formatting
        run: |
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out

  lint-python:
    name: Lint Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
      - uses: asymmetric-effort/actions/actions/setup-python@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - working-directory: sdk/python
        run: ruff check . && ruff format --check .
      - working-directory: sdk/python
        run: mypy --strict ginger/

  lint-typescript:
    name: Lint TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
      - uses: asymmetric-effort/actions/actions/setup-node@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
        with:
          node-version: "22.15.0"
      - working-directory: sdk/typescript
        run: npm install --ignore-scripts
      - working-directory: sdk/typescript
        run: npx tsc --noEmit --strict

  supply-chain:
    name: Supply Chain Audit
    runs-on: ubuntu-latest
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
      - uses: asymmetric-effort/actions/actions/audit-supply-chain@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1

  # ── Stage 2: Test ───────────────────────────────────────────────────
  test:
    name: Test (>=98% coverage)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
      - uses: asymmetric-effort/actions/actions/setup-go@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
        with:
          go-version-file: go.mod
      - name: Run tests with coverage
        run: |
          go test -race -coverprofile=coverage.txt -covermode=atomic ./internal/... ./tests/integration/...
          cd sdk/go && go test -race ./...
      - name: Enforce coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.txt | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${COVERAGE}%"
          [ "$(echo "${COVERAGE} < 98.0" | bc -l)" -eq 0 ] || (echo "ERROR: ${COVERAGE}% < 98%" && exit 1)

  # ── Stage 3: Build ──────────────────────────────────────────────────
  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
      - uses: asymmetric-effort/actions/actions/setup-go@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
        with:
          go-version-file: go.mod
      - name: Build all platforms
        run: |
          for GOOS in linux darwin; do
            for GOARCH in amd64 arm64; do
              CGO_ENABLED=0 GOOS=${GOOS} GOARCH=${GOARCH} \
                go build -ldflags="-s -w" -o "bin/ginger-${GOOS}-${GOARCH}" ./cmd/ginger
            done
          done
      - name: Verify
        run: file bin/ginger-linux-amd64 && bin/ginger-linux-amd64 version

  # ── Stage 4: E2E ───────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
      - uses: asymmetric-effort/actions/actions/setup-go@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build -o bin/ginger ./cmd/ginger
      - run: go test -tags=e2e -race -timeout 10m ./tests/e2e/...

  # ── Stage 5: Post-Deployment Verification ───────────────────────────
  pdv:
    name: Post-Deployment Verification
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
      - uses: asymmetric-effort/actions/actions/setup-go@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build -o bin/ginger ./cmd/ginger
      - name: Start server
        run: |
          bin/ginger &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          sleep 3
      - name: PDV - Health
        run: |
          curl -sf http://localhost:14269/health/live > /dev/null && echo "PASS: liveness"
          curl -sf http://localhost:14269/health/ready > /dev/null && echo "PASS: readiness"
      - name: PDV - OTLP ingest
        run: |
          curl -sf -X POST http://localhost:4318/v1/traces \
            -H "Content-Type: application/json" \
            -d '{"resourceSpans":[{"scopeSpans":[{"spans":[{"traceId":"00000000000000000000000000000001","spanId":"0000000000000001","name":"pdv","startTimeUnixNano":"1000000000","endTimeUnixNano":"2000000000"}]}]}]}' \
            > /dev/null && echo "PASS: OTLP ingest"
      - name: PDV - Query & Sampling
        run: |
          sleep 2
          curl -sf http://localhost:16686/api/v3/services > /dev/null && echo "PASS: query"
          curl -sf "http://localhost:16686/api/sampling?service=pdv" > /dev/null && echo "PASS: sampling"
      - name: PDV - Version
        run: |
          bin/ginger version | grep -q "ginger v" && echo "PASS version"
      - if: always()
        run: kill "${SERVER_PID}" 2>/dev/null || true

  # ── Stage 6: Publish (after PDV) ───────────────────────────────────
  publish-docker:
    name: Publish Docker
    needs: pdv
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
      - id: meta
        run: |
          echo "sha_tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          [[ "${GITHUB_REF}" == refs/tags/v* ]] && echo "version_tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT" || true
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          TAGS="-t ghcr.io/asymmetric-effort/ginger:${{ steps.meta.outputs.sha_tag }} -t ghcr.io/asymmetric-effort/ginger:latest"
          [ -n "${{ steps.meta.outputs.version_tag }}" ] && TAGS="$TAGS -t ghcr.io/asymmetric-effort/ginger:${{ steps.meta.outputs.version_tag }}"
          docker build --label "org.opencontainers.image.source=https://github.com/asymmetric-effort/ginger" $TAGS .
          docker push --all-tags ghcr.io/asymmetric-effort/ginger

  publish-helm:
    name: Publish Helm
    needs: pdv
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
        with:
          path: source
      - uses: asymmetric-effort/actions/actions/checkout@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
        with:
          ref: gh-pages
          path: gh-pages
      - name: Install Helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/HEAD/scripts/get-helm-3 | bash
      - name: Lint chart
        run: helm lint source/deploy/helm/ginger
      - name: Package chart
        run: helm package source/deploy/helm/ginger --destination /tmp/helm-packages
      - name: Publish to gh-pages /helm/
        run: |
          cd gh-pages
          mkdir -p helm
          cp /tmp/helm-packages/ginger-*.tgz helm/
          helm repo index helm/ --url https://ginger.asymmetric-effort.com/helm
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/
          git diff --cached --quiet && echo "No changes" || git commit -m "Publish Helm chart from ${{ github.sha }}"
          git push origin HEAD:gh-pages

  publish-npm:
    name: Publish npm
    needs: pdv
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/@asymmetric-effort/ginger
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
      - uses: asymmetric-effort/actions/actions/setup-node@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
        with:
          node-version: "22.15.0"
      - name: Configure npm for OIDC
        run: |
          echo "//registry.npmjs.org/:_authToken=" > ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
      - working-directory: sdk/typescript
        run: npm install --ignore-scripts && npx tsc
      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./sdk/typescript/package.json').version")
          [ "$TAG" = "$PKG" ] || (echo "Tag v$TAG != package.json $PKG" && exit 1)
      - name: Publish with provenance
        working-directory: sdk/typescript
        run: npx npm@latest publish --provenance --access public
      - name: Verify publish
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          for i in $(seq 1 10); do
            LATEST=$(npm view @asymmetric-effort/ginger version 2>/dev/null || echo "")
            [ "$LATEST" = "$TAG" ] && echo "Verified: @$TAG on npm" && exit 0
            sleep 5
          done

  publish-pypi:
    name: Publish PyPI
    needs: pdv
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/asymmetric-effort-ginger/
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
      - uses: asymmetric-effort/actions/actions/setup-python@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
        with:
          python-version: "3.12"
      - run: pip install build "twine>=6.1.0" "packaging>=24.2"
      - working-directory: sdk/python
        run: python -m build
      - name: Publish via OIDC
        run: python scripts/pypi-oidc-publish.py

  # ── Stage 6b: Deploy Site (blue-green) ────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    needs: pdv
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
        with:
          ref: gh-pages
          path: gh-pages
      - uses: asymmetric-effort/actions/actions/checkout@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
        with:
          path: source
      - name: Deploy to /staging/
        run: |
          cd gh-pages
          rm -rf staging
          cp -r ../source/site staging
          echo "ginger.asymmetric-effort.com" > CNAME
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" || git commit -m "Deploy staging from ${{ github.sha }}"
          git push origin HEAD:gh-pages

  pdv-staging:
    name: PDV Staging
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
      - uses: asymmetric-effort/actions/actions/setup-node@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
        with:
          node-version: "22.15.0"
      - name: Install Playwright
        working-directory: site
        run: |
          npm install
          npx playwright install chromium --with-deps
      - name: Wait for staging deploy
        run: |
          echo "Waiting for staging to be live..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://ginger.asymmetric-effort.com/staging/index.html?cb=$(date +%s)")
            if [ "$STATUS" = "200" ]; then
              echo "Staging live after ${i}0s"
              exit 0
            fi
            echo "Attempt $i/30: status=$STATUS"
            sleep 10
          done
          echo "WARNING: staging may still be propagating, continuing anyway"
      - name: Run PDV against staging
        working-directory: site
        env:
          SITE_URL: https://ginger.asymmetric-effort.com/staging/
        run: npx playwright test

  promote-production:
    name: Promote to Production
    needs: pdv-staging
    runs-on: ubuntu-latest
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
        with:
          ref: gh-pages
          path: gh-pages
      - name: Promote staging to root
        run: |
          cd gh-pages
          # Preserve CNAME and .nojekyll
          cp CNAME /tmp/CNAME.bak 2>/dev/null || echo "ginger.asymmetric-effort.com" > /tmp/CNAME.bak
          cp .nojekyll /tmp/.nojekyll.bak 2>/dev/null || touch /tmp/.nojekyll.bak
          # Remove old root content (preserve staging/, helm/, .git/, CNAME, .nojekyll)
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name 'staging' ! -name 'helm' ! -name 'CNAME' ! -name '.nojekyll' -exec rm -rf {} +
          # Copy staging to root
          cp -r staging/* .
          # Restore CNAME and .nojekyll
          cp /tmp/CNAME.bak CNAME
          cp /tmp/.nojekyll.bak .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" || git commit -m "Promote staging to production from ${{ github.sha }}"
          git push origin HEAD:gh-pages

  pdv-production:
    name: PDV Production
    needs: promote-production
    runs-on: ubuntu-latest
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
      - uses: asymmetric-effort/actions/actions/setup-node@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
        with:
          node-version: "22.15.0"
      - name: Install Playwright
        working-directory: site
        run: |
          npm install
          npx playwright install chromium --with-deps
      - name: Wait for production deploy
        run: |
          echo "Waiting for production to be live..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://ginger.asymmetric-effort.com/?cb=$(date +%s)")
            if [ "$STATUS" = "200" ]; then
              echo "Production live after ${i}0s"
              exit 0
            fi
            echo "Attempt $i/30: status=$STATUS"
            sleep 10
          done
          echo "WARNING: production may still be propagating"
      - name: Run PDV against production
        working-directory: site
        env:
          SITE_URL: https://ginger.asymmetric-effort.com/
        run: npx playwright test

  # ── Stage 7: GitHub Release (only tags) ─────────────────────────────
  release:
    name: GitHub Release
    needs: [publish-docker, publish-helm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
        with:
          fetch-depth: 0
      - uses: asymmetric-effort/actions/actions/setup-go@ba6bb9612d80cfb19aec4fe3db1941d17a2d9af1
        with:
          go-version-file: go.mod
      - name: Build release binaries
        run: |
          for GOOS in linux darwin; do
            for GOARCH in amd64 arm64; do
              CGO_ENABLED=0 GOOS=${GOOS} GOARCH=${GOARCH} \
                go build -ldflags="-s -w" -o "bin/ginger-${GOOS}-${GOARCH}" ./cmd/ginger
            done
          done
      - uses: asymmetric-effort/actions/actions/gh-release@e565630fb74add31f164fc517eff80906801e8aa
        with:
          files: bin/ginger-*
