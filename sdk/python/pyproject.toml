[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asymmetric-effort-ginger"
version = "0.0.2"
description = "Ginger Python SDK — zero-dependency OpenTelemetry tracing client with OTLP HTTP export"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Asymmetric Effort, LLC"}
]
keywords = ["opentelemetry", "tracing", "observability", "otlp", "ginger", "kubernetes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/asymmetric-effort/ginger"
Repository = "https://github.com/asymmetric-effort/ginger"
Issues = "https://github.com/asymmetric-effort/ginger/issues"
Documentation = "https://github.com/asymmetric-effort/ginger/tree/main/docs"

[tool.setuptools.packages.find]
include = ["ginger*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.10"
