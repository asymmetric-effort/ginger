version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - misspell
    - goimports
    - ineffassign
    - typecheck

linters-settings:
  govet:
    enable-all: true
  misspell:
    locale: US

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
