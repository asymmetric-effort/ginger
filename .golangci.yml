version: "2"

run:
  timeout: 5m

linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - ireturn
    - varnamelen
    - wrapcheck
    - err113
    - mnd
    - nlreturn
    - wsl
    - gofumpt
    - godox
    - tagliatelle
    - testpackage
    - paralleltest
    - tparallel
    - forcetypeassert
    - nonamedreturns
    - exhaustive
    - gochecknoglobals
    - gochecknoinits
    - lll
    - funlen
    - cyclop
    - gocyclo
    - gocognit
    - nestif
    - maintidx
    - goconst
    - dupl
    - contextcheck
    - containedctx
    - musttag
    - tagalign
    - inamedparam
    - perfsprint
    - protogetter
    - intrange
    - copyloopvar
    - recvcheck
    - gosmopolitan

linters-settings:
  govet:
    enable-all: true
  misspell:
    locale: US

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
